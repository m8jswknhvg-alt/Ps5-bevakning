name: PS5 Pro-bevakning

on:
  schedule:
    # Var 10:e minut (minut 4, 14, 24 …). Udda minuter = mindre kö hos GitHub.
    - cron: "4-59/10 * * * *"
  workflow_dispatch: # gör att du kan köra den manuellt med "Run workflow"
    inputs:
      test_notis:
        description: "Bara skicka en testnotis (kollar inte butikerna)"
        type: boolean
        default: false

permissions:
  contents: write # behövs för att spara state.json och STATUS.md

concurrency:
  group: ps5-bevakning
  cancel-in-progress: false

jobs:
  kolla:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installera curl_cffi (färre blockeringar)
        run: pip install --quiet curl_cffi || echo "curl_cffi gick inte att installera – kör utan"

      - name: Kolla butikerna
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test_notis }}" = "true" ]; then
            python bevaka.py --test-notis
          else
            python bevaka.py
          fi

      - name: Spara status om något ändrats
        run: |
          git config user.name "ps5-bevakning"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json STATUS.md
          if git diff --cached --quiet; then
            echo "Ingen ändring"
          else
            git commit -m "Lagerstatus uppdaterad"
            git pull --rebase --quiet && git push
          fi
